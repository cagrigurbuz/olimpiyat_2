<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olimpiyat Defteri</title>
<meta name="description" content="5. sınıf matematik olimpiyatı hazırlığı: konu özetleri, ipuçlu sorular, adım adım çözümler, süreli deneme sınavı.">
<meta name="theme-color" content="#3B4CCA">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Olimpiyat">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --paper:#F5F7FB; --grid:rgba(59,76,202,.075); --surface:#FFFFFF; --surface-2:#F0F2FA;
  --ink:#1B2340; --muted:#5A6484; --line:#D8DDEB;
  --accent:#3B4CCA; --accent-ink:#FFFFFF; --accent-soft:#E7EAFB;
  --mark:#FFE066; --good:#1E8A5A; --good-soft:#E2F4EB; --bad:#C63A4E; --bad-soft:#FBE7EA;
  --shadow:0 1px 2px rgba(27,35,64,.06),0 6px 20px rgba(27,35,64,.06);
  --r:14px;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#11162A; --grid:rgba(150,165,255,.06); --surface:#1A2038; --surface-2:#222947;
    --ink:#E9ECF8; --muted:#A0A8C6; --line:#2E3657;
    --accent:#8E9BFF; --accent-ink:#11162A; --accent-soft:#262E55;
    --mark:#C9A51E; --good:#4FC98F; --good-soft:#15342A; --bad:#FF7486; --bad-soft:#3B1D27;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11162A; --grid:rgba(150,165,255,.06); --surface:#1A2038; --surface-2:#222947;
  --ink:#E9ECF8; --muted:#A0A8C6; --line:#2E3657;
  --accent:#8E9BFF; --accent-ink:#11162A; --accent-soft:#262E55;
  --mark:#C9A51E; --good:#4FC98F; --good-soft:#15342A; --bad:#FF7486; --bad-soft:#3B1D27;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  padding-inline:16px; padding-block:0 96px;
}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.005em}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.hl{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 .08em}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;transform:rotate(-4deg)}
.brand h1{font-size:24px;font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip b{font-family:var(--display);font-size:16px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-block:6px 18px;overflow-x:auto}
.tab{flex:1 0 auto;border:0;background:none;padding:9px 14px;border-radius:9px;font-weight:800;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.tab .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;line-height:20px}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:11px 18px;font-weight:800;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 12px;font-size:14px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{background:none;border:0;cursor:pointer;color:var(--muted);font-weight:800;padding:4px 0;margin-bottom:6px}
.back:hover{color:var(--accent)}

/* home */
.hello{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:end;margin-bottom:22px}
.hello h2{font-size:clamp(28px,4.4vw,40px);font-weight:800}
.hello p{margin:.4em 0 0;color:var(--muted);max-width:52ch}
.name-edit{display:inline-flex;gap:6px;align-items:center}
.name-edit input{font:inherit;font-size:16px;padding:6px 10px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:160px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);padding:14px 6px}
.summary div{padding:0 12px;border-left:1px solid var(--line)}
.summary div:first-child{border-left:0}
.summary b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.summary span{font-size:13px;color:var(--muted);font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h3{font-size:22px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tcard{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;padding:14px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);transition:transform .12s ease,border-color .12s}
.tcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.glyph{grid-row:span 2;width:50px;height:50px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em}
.tcard h4{margin:0;font-family:var(--display);font-size:17px;line-height:1.2}
.tmeta{font-size:13px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:6px}
.bar{grid-column:1/-1;height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tips{margin-top:26px;padding:18px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tips h4{margin:0 0 4px;font-family:var(--display);font-size:17px}
.tips p{margin:0;font-size:14px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:14px}

/* topic page */
.thead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.thead h2{font-size:clamp(26px,4vw,34px)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 14px;font-weight:800;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.lesson{padding:22px 24px;display:grid;gap:18px}
.lesson ul{margin:0;padding-left:1.2em;display:grid;gap:8px;max-width:70ch}
.tactic{background:var(--accent-soft);border-radius:12px;padding:14px 16px;max-width:70ch}
.example{border:1.5px dashed var(--line);border-radius:12px;padding:14px 16px;max-width:70ch}
.example .ans{margin-top:8px}

/* practice */
.practice{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}
.qcard{padding:22px 24px}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.lv{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--muted)}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.qtext{font-size:19px;line-height:1.6;margin:0 0 14px;max-width:62ch}
.fig{display:block;max-width:100%;height:auto;margin:6px 0 16px;overflow:visible}
.fig line,.fig rect,.fig polygon,.fig polyline{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig text{fill:var(--muted);font:700 13px var(--body)}
.fig .pt{fill:var(--accent);stroke:none}
.choices{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;min-height:52px}
.choice:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.choice .L{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.ok .L{background:var(--good);border-color:var(--good);color:#fff}
.choice.no{border-color:var(--bad);background:var(--bad-soft)}
.choice.no .L{background:var(--bad);border-color:var(--bad);color:#fff}
.choice[disabled]{cursor:default}
.choice.dim{opacity:.55}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.15;margin:0 .12em}
.fr span:first-child{border-bottom:1.6px solid currentColor;padding:0 .18em}
.qfoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.hint{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:15px;max-width:66ch}
.hint b.t{font-family:var(--display);color:var(--accent)}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb h4{margin:0 0 6px;font-family:var(--display);font-size:19px}
.fb.good h4{color:var(--good)}
.fb.bad h4{color:var(--bad)}
.steps{margin:0;padding-left:1.3em;display:grid;gap:5px;font-size:15.5px}
.side{padding:16px 18px;display:grid;gap:14px}
.side .big{font-family:var(--display);font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.levels{display:grid;gap:6px}
.levels button{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer}
.levels button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.kbd{font-size:12px;color:var(--muted)}
.kbd kbd{font-family:var(--body);font-weight:800;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}

/* exam */
.exam-setup{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.form{padding:22px 24px;display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label,.field .lab{font-weight:800}
.field select{font:inherit;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);max-width:260px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}
.hist{padding:20px 22px}
.hist svg{width:100%;height:auto;display:block}
.hist svg text{fill:var(--muted);font:700 11px var(--body)}
.hist svg .b{fill:var(--accent)}
.hist svg .axis{stroke:var(--line)}
.hist ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:14px}
.hist li{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:4px;font-variant-numeric:tabular-nums}
.ebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.timer{font-family:var(--display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.nav button{height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.nav button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.nav button.cur{outline:2.5px solid var(--ink);outline-offset:1px}
.nav button.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.nav button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.result{padding:22px 24px;display:grid;gap:18px}
.score{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.score .main{font-family:var(--display);font-size:64px;font-weight:800;line-height:.9;font-variant-numeric:tabular-nums}
.score .main small{font-size:22px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(4,auto);gap:4px 22px;font-variant-numeric:tabular-nums}
.kv b{font-family:var(--display);font-size:24px;display:block;line-height:1.1}
.kv span{font-size:13px;color:var(--muted);font-weight:700}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right}
details.rev{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
details.rev+details.rev{margin-top:8px}
details.rev summary{cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:baseline}
details.rev summary .tag{flex:none;font-size:12px;font-weight:800;padding:1px 8px;border-radius:99px}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.no{background:var(--bad-soft);color:var(--bad)}
.tag.bos{background:var(--surface-2);color:var(--muted)}
details.rev .body{padding-top:10px;display:grid;gap:10px}

/* mistakes */
.mlist{display:grid;gap:8px}
.mitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px}
.mitem p{margin:2px 0 0;font-size:15px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:6px 8px;border-radius:8px}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.empty{padding:30px 24px;text-align:center}
.empty h3{font-size:22px;margin-bottom:6px}

/* scratch pad */
#padBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:var(--shadow)}
#pad{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.12);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
#pad .padbar{max-width:1040px;margin:0 auto 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#pad canvas{display:block;width:100%;max-width:1040px;height:min(42vh,340px);margin:0 auto;border-radius:12px;border:1px solid var(--line);touch-action:none;cursor:crosshair;
  background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.pen{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.pen[aria-pressed="true"]{outline:2.5px solid var(--ink);outline-offset:2px}

@media (max-width:820px){
  .practice,.exam-setup{grid-template-columns:1fr}
  .hello{grid-template-columns:1fr}
  .tips{grid-template-columns:1fr}
}
@media (max-width:520px){
  .summary{grid-template-columns:repeat(2,1fr);row-gap:12px}
  .summary div:nth-child(3){border-left:0}
  .qcard,.lesson,.form,.result{padding:18px 16px}
  .qtext{font-size:17.5px}
  .kv{grid-template-columns:repeat(2,auto)}
  .tab{padding:8px 10px;font-size:14px}
  .summary span{font-size:12px}
  .score .main{font-size:52px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.01)}100%{transform:scale(1)}}
.fb{animation:pop .25s ease}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <button class="brand" data-act="home" aria-label="Ana sayfa">
      <span class="brand-mark">∑</span>
      <h1>Olimpiyat <span class="hl">Defteri</span></h1>
    </button>
    <div class="chips" id="chips"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Bölümler"></nav>
  <main id="view"></main>
</div>

<button class="btn" id="padBtn" data-act="pad">✎ Karalama</button>
<div id="pad" hidden>
  <div class="padbar">
    <strong>Karalama kâğıdı</strong>
    <div class="row">
      <button class="pen" data-pen="ink" style="background:var(--ink)" aria-pressed="true" aria-label="Koyu kalem"></button>
      <button class="pen" data-pen="accent" style="background:var(--accent)" aria-pressed="false" aria-label="Mavi kalem"></button>
      <button class="pen" data-pen="bad" style="background:var(--bad)" aria-pressed="false" aria-label="Kırmızı kalem"></button>
      <button class="btn small" id="padClear">Temizle</button>
      <button class="btn small primary" data-act="pad">Kapat</button>
    </div>
  </div>
  <canvas id="padCanvas" aria-label="Karalama alanı"></canvas>
</div>

<script>
/* ===== Olimpiyat Defteri — soru bankası ===== */
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const lcm = (a, b) => a / gcd(a, b) * b;
const fmt = n => typeof n === 'number' ? n.toLocaleString('tr-TR') : String(n);
const fr = (p, q) => `<span class="fr"><span>${p}</span><span>${q}</span></span>`;
const pad2 = n => String(n).padStart(2, '0');

function finish(o, opts, correctIdx, sortNum) {
  let order = opts.map((t, i) => ({ t, c: i === correctIdx, v: o._vals ? o._vals[i] : i }));
  order = sortNum ? order.sort((a, b) => a.v - b.v) : shuffle(order);
  return { topic: o.topic, level: o.level, text: o.text, fig: o.fig || '', choices: order.map(x => x.t), correct: order.findIndex(x => x.c), hint: o.hint || '', sol: o.sol || '' };
}
/* Sayısal cevaplı soru: doğru cevap + mantıklı çeldiriciler, küçükten büyüğe sıralı */
function numQ(o) {
  const ans = o.ans, set = new Set([ans]), ds = [];
  for (const d of (o.distract || [])) {
    if (ds.length === 4) break;
    if (Number.isInteger(d) && d >= (o.min ?? 0) && !set.has(d)) { set.add(d); ds.push(d); }
  }
  let tries = 0; const spread = Math.max(2, Math.round(Math.abs(ans) * 0.12));
  while (ds.length < 4 && tries < 500) {
    tries++;
    const d = ans + (Math.random() < .5 ? -1 : 1) * R(1, spread + Math.floor(tries / 20));
    if (d >= (o.min ?? 0) && !set.has(d)) { set.add(d); ds.push(d); }
  }
  const vals = [ans, ...ds];
  o._vals = vals;
  return finish(o, vals.map(v => o.show ? o.show(v) : fmt(v)), 0, true);
}
/* Metin cevaplı soru */
function txtQ(o, correct, wrongs) {
  const ws = [...new Set(wrongs.filter(w => w !== correct))].slice(0, 4);
  return finish(o, [correct, ...ws], 0, false);
}
const steps = arr => '<ol class="steps">' + arr.map(s => `<li>${s}</li>`).join('') + '</ol>';

function svgGrid(cols, rows, opts = {}) {
  const s = 34, pad = 18, w = cols * s + pad * 2, h = rows * s + pad * 2;
  let g = `<svg class="fig" viewBox="0 0 ${w} ${h}" width="${Math.min(w, 300)}" role="img" aria-label="${cols}×${rows} kareli şekil">`;
  for (let i = 0; i <= cols; i++) g += `<line x1="${pad + i * s}" y1="${pad}" x2="${pad + i * s}" y2="${pad + rows * s}" />`;
  for (let j = 0; j <= rows; j++) g += `<line x1="${pad}" y1="${pad + j * s}" x2="${pad + cols * s}" y2="${pad + j * s}" />`;
  if (opts.ab) {
    g += `<circle class="pt" cx="${pad}" cy="${pad + rows * s}" r="5"/><text x="${pad - 14}" y="${pad + rows * s + 14}">A</text>`;
    g += `<circle class="pt" cx="${pad + cols * s}" cy="${pad}" r="5"/><text x="${pad + cols * s + 4}" y="${pad - 5}">B</text>`;
  }
  return g + '</svg>';
}
function svgSticks(kind, n) {
  // kind: 'kare' | 'ucgen' ; n figür 1..3 yan yana gösterilir
  const s = 26; let x0 = 10, out = '', totalW = 0;
  const figs = [1, 2, 3];
  figs.forEach(k => {
    if (kind === 'kare') {
      for (let i = 0; i <= k; i++) out += `<line x1="${x0 + i * s}" y1="10" x2="${x0 + i * s}" y2="${10 + s}"/>`;
      out += `<line x1="${x0}" y1="10" x2="${x0 + k * s}" y2="10"/><line x1="${x0}" y1="${10 + s}" x2="${x0 + k * s}" y2="${10 + s}"/>`;
      out += `<text x="${x0 + k * s / 2}" y="${10 + s + 20}" text-anchor="middle">${k}. şekil</text>`;
      x0 += k * s + 34;
    } else {
      // k tane üçgen (aşağı-yukarı dönüşümlü şerit)
      const hh = s * 0.87; const top = 10, bot = 10 + hh;
      for (let i = 0; i < k; i++) {
        const bx = x0 + Math.floor(i / 2) * s;
        if (i % 2 === 0) { out += `<polyline points="${bx},${bot} ${bx + s / 2},${top} ${bx + s},${bot} ${bx},${bot}" fill="none"/>`; }
        else { out += `<polyline points="${bx + s / 2},${top} ${bx + s * 1.5},${top} ${bx + s},${bot}" fill="none"/>`; }
      }
      const wdt = Math.ceil(k / 2) * s + (k % 2 === 0 ? s / 2 : 0);
      out += `<text x="${x0 + wdt / 2}" y="${bot + 20}" text-anchor="middle">${k}. şekil</text>`;
      x0 += wdt + 34;
    }
  });
  totalW = x0;
  return `<svg class="fig" viewBox="0 0 ${totalW} 70" width="${Math.min(totalW, 340)}" role="img" aria-label="Kibrit çöpü şekilleri">${out}</svg>`;
}
function svgSquaresRow(k) {
  const s = 30, w = k * s + 20;
  let g = `<svg class="fig" viewBox="0 0 ${w} ${s + 20}" width="${Math.min(w, 320)}" role="img" aria-label="Yan yana ${k} kare">`;
  for (let i = 0; i < k; i++) g += `<rect x="${10 + i * s}" y="10" width="${s}" height="${s}" />`;
  return g + '</svg>';
}
function svgFan(n) { // tepeden tabana n doğru parçası
  const w = 260, h = 150, ax = 130, ay = 12, bl = 16, br = 244, by = 138;
  let g = `<svg class="fig" viewBox="0 0 ${w} ${h + 8}" width="260" role="img" aria-label="Tepeden tabana çizilen doğru parçaları olan üçgen"><polygon points="${ax},${ay} ${bl},${by} ${br},${by}" fill="none"/>`;
  for (let i = 1; i <= n; i++) { const x = bl + (br - bl) * i / (n + 1); g += `<line x1="${ax}" y1="${ay}" x2="${x}" y2="${by}"/>`; }
  return g + '</svg>';
}

T('guvercin', 'En Kötü Durum', '□□', {

    'Aynı renkten k tane garantilemek için: her renkten k − 1 tane çektiğini düşün (o kadar yoksa hepsini), sonra 1 tane daha çek.',
    'Belirli bir renkten (örneğin kırmızı) k tane garantilemek için: diğer renklerin hepsini çektiğini düşün, sonra k kırmızı.'
  ],
  tactic: 'Kendine “<b>En şanssız ben olsaydım</b> kaç tane çekerdim ve hâlâ istediğimi alamazdım?” diye sor. Cevap bu sayının 1 fazlası.',

}, [
  l => {
    const names = ['kırmızı', 'mavi', 'yeşil', 'sarı'];

    const list = cs.map((c, i) => `${c} ${names[i]}`).join(', ').replace(/, ([^,]*)$/, ' ve $1');
    const total = cs.reduce((a, b) => a + b);
    if (l === 1) return numQ({ topic: 'guvercin', level: 1, ans: nc + 1, text: `Bir çekmecede ${list} çorap vardır. Karanlıkta hiç bakmadan en az kaç çorap çekilirse kesinlikle aynı renkten 2 çorap elde edilmiş olur?`,
      distract: [nc, 2, nc + 2, Math.max(...cs) + 1, total],
      hint: 'En kötü durumda her çektiğin farklı renk olur. Kaç tane farklı renk var?',
      sol: steps([`En kötü durumda ilk ${nc} çorap birbirinden farklı renkte çıkar.`, `Bir sonraki çorap mutlaka bunlardan biriyle aynı renktir: ${nc} + 1 = <b>${nc + 1}</b>`]) });

      const k = R(3, 4); if (!cs.some(c => c >= k)) cs[0] = k + 2;

        distract: [(k - 1) * nc, k * nc, ans + 1, nc + 1, ans - 1],
        hint: `En kötü durumda her renkten ${k - 1} tane çekersin (bir renkte o kadar top yoksa hepsini).`,
        sol: steps([`En kötü durum: ${cs.map((c, i) => `${Math.min(c, k - 1)} ${names[i]}`).join(', ')} = ${worst} top, hâlâ aynı renkten ${k} yok.`, `Bir top daha: ${worst} + 1 = <b>${ans}</b>`]) });
    }
    if (Math.random() < .5) {
      const k = R(2, Math.min(4, cs[0])), ans = total - cs[0] + k;
      return numQ({ topic: 'guvercin', level: 3, ans, text: `Bir kutuda ${list} top vardır. Bakmadan en az kaç top çekilirse kesinlikle ${k} tane kırmızı top elde edilmiş olur?`,
        distract: [k, total - cs[0], nc * (k - 1) + 1, ans - 1, total],
        hint: 'En kötü durumda önce kırmızı olmayan topların hepsi çıkar.',
        sol: steps([`Kırmızı olmayan top: ${total - cs[0]}. En kötü durumda önce hepsi çıkar.`, `Sonra ${k} kırmızı: ${total - cs[0]} + ${k} = <b>${ans}</b>`]) });
    }
    const mn = Math.min(...cs), ans = total - mn + 1;
    return numQ({ topic: 'guvercin', level: 3, ans, text: `Bir kutuda ${list} top vardır. Bakmadan en az kaç top çekilirse kesinlikle <b>her renkten en az bir</b> top elde edilmiş olur?`,
      distract: [nc, total - mn, total - Math.max(...cs) + 1, total, ans + 1],
      hint: 'En kötü durumda, en az sayıda olan renk en sona kalır.',
      sol: steps([`En az olan renk ${mn} top. En kötü durumda diğer renklerin hepsi önce çıkar: ${total - mn} top.`, `Bir sonraki top son rengi getirir: ${total - mn} + 1 = <b>${ans}</b>`]) });
  },
  l => {
    const useMonth = Math.random() < .6, g = useMonth ? 12 : 7, what = useMonth ? 'aynı ayda' : 'haftanın aynı gününde';
    if (l < 3) {
      const k = l === 1 ? 2 : R(3, 5), ans = g * (k - 1) + 1;
      return numQ({ topic: 'guvercin', level: l, ans, text: `Bir okulda en az kaç öğrenci olmalıdır ki, kesinlikle ${what} doğmuş ${k} öğrenci bulunsun?`,

      hint: `Öğrencileri ${g} gruba olabildiğince eşit dağıt. En kalabalık grupta kaç kişi olur?`,

  }

function curatedQ(c) {
  const [topic, level, text, ok, wrongs, hint, sol, fig] = c;
  return txtQ({ topic, level, text, hint, sol, fig }, ok, shuffle(wrongs));
}
const curatedFor = (topic, level) => CURATED.filter(c => c[0] === topic && (level == null || c[1] === level));

/* Soru üret: konu + seviye. Seçilmiş sorular belli bir olasılıkla karışır. */
function makeQuestion(topicId, level) {
  const t = TOPICS.find(x => x.id === topicId);
  const cur = curatedFor(topicId, level);
  const curAll = curatedFor(topicId);
  if (!t.gens.length) { const pool = cur.length ? cur : curAll; return curatedQ(pick(pool)); }
  if (cur.length && Math.random() < 0.18) return curatedQ(pick(cur));
  for (let i = 0; i < 20; i++) { const q = pick(t.gens)(level); if (q && q.choices.length === 5) return q; }
  return curatedQ(pick(CURATED));
}

function startPractice(mode, topic) {
  const lvl = S.levels[topic || mode] || 1;
  P = { mode, topic, level: lvl, q: null, picked: null, hint: false, n: 0, ok: 0, recent: [], tab: mode === 'topic' && !S.stats[topic] ? 'lesson' : 'practice', mIdx: 0, mid: null };
  nextQ(); go('topic');
}
function nextQ() {
  P.picked = null; P.hint = false; P.showEx = false;
  if (P.mode === 'mistakes') {
    if (!S.mistakes.length) { P.q = null; return; }
    const m = S.mistakes[P.mIdx % S.mistakes.length]; P.mid = m.id; P.q = m.q; P.n++; return;
  }
  let q;
  for (let i = 0; i < 10; i++) {
    const tid = P.mode === 'mix' ? pick(TOPICS).id : P.topic;
    const lv = P.mode === 'mix' ? P.level : P.level;
    q = makeQuestion(tid, lv);
    if (!P.recent.includes(q.text)) break;
  }
  P.recent.push(q.text); P.recent = P.recent.slice(-12);
  P.q = q; P.n++;
}
function answer(i) {
  if (P.picked !== null || !P.q) return;
  P.picked = i; const q = P.q, ok = i === q.correct;
  if (ok) P.ok++;
  record(q, ok, P.hint);
  if (P.mode === 'mistakes') { if (ok) { S.mistakes = S.mistakes.filter(m => m.id !== P.mid); } else P.mIdx++; }
  else if (!ok) addMistake(q, i);
  save(); render();
  const fb = document.querySelector('.fb'); if (fb) fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function topicView() {
  const t = P.mode === 'topic' ? TOPICS.find(x => x.id === P.topic) : null;
  const title = t ? t.name : P.mode === 'mix' ? 'Karışık Alıştırma' : 'Yanlışlarımı Tekrar Çöz';
  const m = t ? mastery(t.id) : null;
  const tabs = t ? `<div class="seg" role="group" aria-label="Görünüm"><button data-ptab="lesson" aria-pressed="${P.tab === 'lesson'}">Konu özeti</button><button data-ptab="practice" aria-pressed="${P.tab === 'practice'}">Soru çöz</button></div>` : '';
  let body;
  if (t && P.tab === 'lesson') {
    body = `<article class="card lesson">
      <div><div class="eyebrow">Bilmen gerekenler</div><ul>${t.lesson.facts.map(f => `<li>${f}</li>`).join('')}</ul></div>
      <div class="tactic"><div class="eyebrow">Olimpiyat taktiği</div>${t.lesson.tactic}</div>
      <div class="example"><div class="eyebrow">Örnek soru</div><div>${t.lesson.example.q}</div>
        ${P.showEx ? `<div class="ans"><b>Çözüm:</b> ${t.lesson.example.a}</div>` : `<button class="btn small" style="margin-top:10px" data-act="showEx">Çözümü göster</button>`}</div>
      <div><button class="btn primary" data-ptab="practice">Soru çözmeye başla →</button></div>

  } else if (!P.q) {

  } else body = practiceView();

    <div class="thead"><div><div class="eyebrow">${t ? 'Konu · ' + mLabel(m) + ' · %' + m + ' ustalık' : P.mode === 'mix' ? 'Tüm konulardan' : S.mistakes.length + ' soru bekliyor'}</div><h2>${title}</h2></div>${tabs}</div>
    ${body}`;
}
function practiceView() {
  const q = P.q, done = P.picked !== null;
  const lvl = q.level;
  const choices = q.choices.map((c, i) => {

      <div><div class="eyebrow">Bu oturum</div><div class="big">${P.ok}<span class="muted" style="font-size:18px"> / ${P.n - (done ? 0 : 1)} doğru</span></div></div>
      ${levelSel}
      <div class="kbd">Klavye: <kbd>A</kbd>–<kbd>E</kbd> ile cevapla, <kbd>Enter</kbd> ile sonraki soru, <kbd>İ</kbd> ya da <kbd>H</kbd> ile ipucu.</div>
      <div class="kbd">İpucu alarak doğru cevap: yarım puan. Kolay 10, orta 20, zor 30 puan.</div>

}

    h.forEach((e, i) => { const bh = (H - pb - 12) * Math.max(0, e.score) / 100, x = pl + 6 + i * bw, y = H - pb - bh; g += `<rect class="b" x="${x}" y="${y}" width="${bw - 10}" height="${Math.max(bh, 1)}" rx="3"/><text x="${x + (bw - 10) / 2}" y="${Math.max(y - 4, 10)}" text-anchor="middle">${e.score}</text><text x="${x + (bw - 10) / 2}" y="${H - 6}" text-anchor="middle">${i + 1}</text>`; });

    </section>

function startExam(n, mins, pen) {
  const tids = shuffle(TOPICS.map(t => t.id)); const qs = [], seen = new Set();
  for (let i = 0; i < n; i++) {
    const lv = i < Math.round(n * .3) ? 1 : i < Math.round(n * .75) ? 2 : 3;
    let q; for (let k = 0; k < 10; k++) { q = makeQuestion(tids[i % tids.length], lv); if (!seen.has(q.text)) break; }
    seen.add(q.text); qs.push(q);
  }
  E = { qs, ans: Array(n).fill(null), i: 0, end: Date.now() + mins * 60000, mins, pen, done: false, confirm: false };
  clearInterval(timerId); timerId = setInterval(tick, 1000); go('exam');
}
function tick() {
  if (!E || E.done) { clearInterval(timerId); return; }
  const left = Math.max(0, Math.round((E.end - Date.now()) / 1000));
  const el = $('#timer'); if (el) { el.textContent = pad2(Math.floor(left / 60)) + ':' + pad2(left % 60); el.classList.toggle('low', left < 120); }
  if (left <= 0) finishExam();
}
function examRunView() {
  const q = E.qs[E.i], a = E.ans[E.i];
  const left = Math.max(0, Math.round((E.end - Date.now()) / 1000));
  const answered = E.ans.filter(x => x !== null).length;
  return `<div class="ebar">
      <div><div class="eyebrow">Deneme sınavı</div><strong>Soru ${E.i + 1} / ${E.qs.length}</strong> <span class="muted">· ${answered} cevaplandı</span></div>
      <div class="timer ${left < 120 ? 'low' : ''}" id="timer" aria-live="off">${pad2(Math.floor(left / 60))}:${pad2(left % 60)}</div>
      ${E.confirm ? `<div class="confirm">${E.qs.length - answered ? `${E.qs.length - answered} boş soru var.` : ''} Bitirilsin mi? <button class="btn small primary" data-act="finish">Evet, bitir</button><button class="btn small" data-act="noconfirm">Devam et</button></div>` : `<button class="btn small" data-act="askFinish">Sınavı bitir</button>`}
    </div>
    <div class="practice">
      <article class="card qcard">
        <div class="qtop"><span class="eyebrow">Soru ${E.i + 1}</span><span class="lv">${LVN[q.level]} <span class="dots">${[1, 2, 3].map(k => `<i class="${k <= q.level ? 'on' : ''}"></i>`).join('')}</span></span></div>
        <p class="qtext">${q.text}</p>${q.fig || ''}
        <ul class="choices">${q.choices.map((c, i) => `<li><button class="choice ${a === i ? 'sel' : ''}" data-eans="${i}"><span class="L">${LET[i]}</span><span>${c}</span></button></li>`).join('')}</ul>
        <div class="qfoot">
          <button class="btn" data-act="prev" ${E.i === 0 ? 'disabled' : ''}>← Önceki</button>
          ${E.i < E.qs.length - 1 ? `<button class="btn primary" data-act="enext">Sonraki →</button>` : `<button class="btn primary" data-act="askFinish">Bitir</button>`}
          ${a !== null ? `<button class="btn ghost" data-act="clear">Boş bırak</button>` : ''}
        </div>
      </article>
      <aside class="card side">
        <div class="eyebrow">Sorular</div>
        <div class="nav">${E.qs.map((_, i) => `<button class="${E.ans[i] !== null ? 'done' : ''} ${i === E.i ? 'cur' : ''}" data-jump="${i}" aria-label="Soru ${i + 1}">${i + 1}</button>`).join('')}</div>
        <div class="kbd">${E.pen ? '4 yanlış 1 doğruyu götürür. Emin değilsen boş bırakabilirsin.' : 'Yanlışlar doğruyu götürmez.'}</div>
      </aside>
    </div>`;
}
function finishExam() {
  clearInterval(timerId);
  let d = 0, y = 0, b = 0; const per = {};
  E.qs.forEach((q, i) => {
    const a = E.ans[i], p = (per[q.topic] ||= { d: 0, y: 0, b: 0 });
    if (a === null) { b++; p.b++; } else if (a === q.correct) { d++; p.d++; record(q, true, false); } else { y++; p.y++; record(q, false, false); addMistake(q, a); }
  });
  const net = E.pen ? d - y / 4 : d, score = Math.max(0, Math.round(net / E.qs.length * 100));
  Object.assign(E, { done: true, d, y, b, net, score, per });
  S.exams.push({ at: Date.now(), n: E.qs.length, d, y, b, net, score }); S.exams = S.exams.slice(-30);
  save(); go('exam');
}

      <div class="tbl-wrap"><table><thead><tr><th>Konu</th><th class="n">D</th><th class="n">Y</th><th class="n">B</th></tr></thead><tbody>${rows}</tbody></table></div>

          <div class="fb ${st === 'ok' ? 'good' : 'bad'}" style="animation:none"><h4>Çözüm</h4>${q.sol}</div></div></details>`; }).join('')}

/* ---------- Yanlışlarım ---------- */

    <div class="card empty"><h3>Listen boş</h3><p class="muted">Yanlış çözdüğün sorular buraya gelir. Onları daha sonra tekrar çözüp listeden çıkarabilirsin.</p><button class="btn primary" data-act="mix">Karışık alıştırma başlat</button></div>`;
  return `<div class="thead"><div><div class="eyebrow">Tekrar listesi · ${S.mistakes.length} soru</div><h2>Yanlışlarım</h2></div><button class="btn primary" data-act="redo">Hepsini tekrar çöz</button></div>
  <div class="mlist">${S.mistakes.map(m => `<div class="card mitem"><div><div class="eyebrow">${tName(m.q.topic)} · ${LVN[m.q.level]} · ${new Date(m.at).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' })}</div><p>${escapeHtml(strip(m.q.text))}</p></div><button class="x" data-del="${m.id}" aria-label="Listeden sil">×</button></div>`).join('')}</div>`;

/* ---------- Olaylar ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.go) { if (d.go === 'exam' && E && E.done) E = null; go(d.go); return; }
  if (d.topic) { startPractice('topic', d.topic); return; }
  if (d.ptab) { P.tab = d.ptab; render(); return; }
  if (d.ans !== undefined) { answer(+d.ans); return; }
  if (d.level) { P.level = +d.level; S.levels[P.topic || P.mode] = P.level; save(); if (P.picked === null) { P.n--; nextQ(); } render(); return; }
  if (d.eans !== undefined) { E.ans[E.i] = E.ans[E.i] === +d.eans ? null : +d.eans; render(); return; }
  if (d.jump !== undefined) { E.i = +d.jump; E.confirm = false; render(); return; }
  if (d.open !== undefined) { const el = document.querySelectorAll('details.rev')[+d.open]; if (el) { el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
  if (d.del) { S.mistakes = S.mistakes.filter(m => m.id !== d.del); save(); render(); return; }
  if (d.pen) { document.querySelectorAll('.pen').forEach(p => p.setAttribute('aria-pressed', p === b)); pad.color = d.pen; return; }
  switch (d.act) {
    case 'home': go('home'); break;
    case 'mix': startPractice('mix'); break;
    case 'redo': E = E && E.done ? null : E; startPractice('mistakes'); break;
    case 'hint': P.hint = true; render(); break;
    case 'next': nextQ(); render(); window.scrollTo({ top: 0 }); break;
    case 'skip': P.n--; nextQ(); render(); break;
    case 'showEx': P.showEx = true; render(); break;
    case 'editName': $('#nameArea').innerHTML = nameEditor(true); $('#nameInput').focus(); break;
    case 'saveName': S.name = $('#nameInput').value.trim(); save(); render(); break;
    case 'prev': E.i = Math.max(0, E.i - 1); E.confirm = false; render(); break;
    case 'enext': E.i = Math.min(E.qs.length - 1, E.i + 1); render(); break;
    case 'clear': E.ans[E.i] = null; render(); break;
    case 'askFinish': E.confirm = true; render(); break;
    case 'noconfirm': E.confirm = false; render(); break;
    case 'finish': finishExam(); break;
    case 'newExam': E = null; go('exam'); break;
    case 'pad': togglePad(); break;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'examForm') startExam(+$('#exN').value, +$('#exT').value, $('#exP').checked);
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey) { if (e.key === 'Enter' && e.target.id === 'nameInput') { S.name = e.target.value.trim(); save(); render(); } return; }
  if (!$('#pad').hidden) return;
  const k = e.key.toUpperCase();
  const idx = 'ABCDE'.indexOf(k) >= 0 ? 'ABCDE'.indexOf(k) : '12345'.indexOf(k);
  if (route === 'topic' && P && P.q && P.tab === 'practice') {
    if (idx >= 0 && P.picked === null) answer(idx);
    else if (e.key === 'Enter' && P.picked !== null) { nextQ(); render(); }
    else if ((k === 'H' || k === 'İ' || k === 'I') && P.picked === null) { P.hint = true; render(); }
  } else if (route === 'exam' && E && !E.done) {
    if (idx >= 0) { E.ans[E.i] = idx; render(); }
    else if (e.key === 'ArrowRight') { E.i = Math.min(E.qs.length - 1, E.i + 1); render(); }
    else if (e.key === 'ArrowLeft') { E.i = Math.max(0, E.i - 1); render(); }
  }
});

/* ---------- Karalama kâğıdı ---------- */
const pad = { color: 'ink', drawing: false, ready: false };
function togglePad() {
  const el = $('#pad'); el.hidden = !el.hidden; $('#padBtn').hidden = !el.hidden;
  if (!el.hidden) sizePad();
}
function sizePad() {
  const c = $('#padCanvas'), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (c.width === Math.round(r.width * dpr) && c.height === Math.round(r.height * dpr)) return;
  const old = pad.ready ? c.toDataURL() : null;
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (old) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = old; }
  pad.ready = true;
}
(() => {
  const c = $('#padCanvas'); let last = null;
  const pos = ev => { const r = c.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
  c.addEventListener('pointerdown', ev => { c.setPointerCapture(ev.pointerId); pad.drawing = true; last = pos(ev); });
  c.addEventListener('pointermove', ev => {
    if (!pad.drawing) return; const ctx = c.getContext('2d'), p = pos(ev);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--' + pad.color).trim();
    ctx.lineWidth = ev.pressure && ev.pointerType === 'pen' ? 1.5 + ev.pressure * 2.5 : 2.6;
    ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p;
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => c.addEventListener(t, () => { pad.drawing = false; }));
  $('#padClear').addEventListener('click', () => { const ctx = c.getContext('2d'); ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); ctx.restore(); });
  window.addEventListener('resize', () => { if (!$('#pad').hidden) sizePad(); });
})();

render();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
